name: Update Project Cards

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate projects.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          REPOS: LankaTransit-177,Battlezik
        run: python .github/scripts/generate_projects.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.svg
          git diff --staged --quiet || git commit -m "chore: refresh project cards"
          git push
